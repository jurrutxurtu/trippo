name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jurrutxurtu/trippo

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Verification (lint, typecheck, tests, golden fixtures)
  # ---------------------------------------------------------------------------
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: |
          cd backend
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          cd backend
          .venv/bin/ruff check trippo tests scripts

      - name: Run Mypy Typecheck
        run: |
          cd backend
          .venv/bin/mypy trippo

      - name: Run Pytest & Golden Fixture Tests
        run: |
          cd backend
          .venv/bin/pytest

      - name: Verify Schema Documentation Drift
        run: |
          cd backend
          .venv/bin/python scripts/gen_schema_docs.py --check

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Compilation
        run: |
          cd frontend
          npm ci
          npm run build

  # ---------------------------------------------------------------------------
  # Step 2: Build & Push Container Image to GHCR (ARM64)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 target)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Step 3: Deploy to Oracle Cloud Always Free VM
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Oracle Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy configuration files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/apps/trippo"

      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME || 'ubuntu' }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            mkdir -p /home/ubuntu/apps/trippo/data/capsules
            cd /home/ubuntu/apps/trippo

            # Log into GitHub Container Registry to pull the image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image and update container
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up dangling images to preserve disk space
            docker image prune -f

            # Reload Caddy if configuration exists
            if [ -f /etc/caddy/conf.d/trippo.caddy ]; then
              sudo systemctl reload caddy || true
            fi
